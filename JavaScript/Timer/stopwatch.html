<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StopWatch Antar Ra Babu</title>
</head>
<body>
    <h1 id="display"></h1>
    <button onclick="startTime()">Start</button>
    <button onclick="PauseTimer()">Pause</button>
    <button onclick="ResetTimer()">Reset</button>

    <script>
        let seconds=0,min=0,hours=0;
        let store=null;

        const display = document.getElementById("display");
        function startTime(){
            if (!store) {   // only start if not already running
                store = setInterval(timer, 1000);
            }
        }
        function PauseTimer(){
            clearInterval(store);
            store=null;
        }
        function ResetTimer(){
            clearInterval(store);
            store = null;

            seconds = 0;
            min = 0;
            hours = 0;

            display.textContent = formatTime();
        }
        function formatTime() {
            return `${hours.toString().padStart(2,"0")}:${min.toString().padStart(2,"0")}:${seconds.toString().padStart(2,"0")}`;
        }
        function timer(){
            seconds++;
            if(seconds==60){
                min++;
                seconds=0;
            }
            if(min==60){
                hours++;
                min=0;
            }
            display.textContent = formatTime();
        }
    </script>
</body>
</html>
