<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock Ra</title>
</head>
<body>
    <h1 id="myh1"></h1>
    <script>
        function startTime(){
            const d = new Date();
            document.getElementById("myh1").innerHTML=d.toLocaleTimeString();
        }
        startTime();//"setInterval delays the first execution, so we call the function once manually to avoid initial delay."
        setInterval(startTime,1000);
    </script>
</body>
</html>
