<nav class="navbar navbar-expand-lg custom-navbar px-4 shadow-sm">

  <!-- Brand -->
  <span class="navbar-brand fw-bold fs-4 brand">
    ⚡ TaskFlow Pro
  </span>

  <!-- Toggle -->
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navBarContent">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navBarContent">

    <!-- LEFT NAV -->
    <div class="ms-4 d-flex gap-2 align-items-center">

      <ng-container *ngIf="isUser()">

        <a routerLink="/user/dashboard"
           routerLinkActive="active-link"
           class="nav-pill">
          Dashboard
        </a>

        <a routerLink="/user/tasks"
           routerLinkActive="active-link"
           class="nav-pill">
          My Tasks
        </a>

      </ng-container>

      <ng-container *ngIf="isAdmin()">

        <a routerLink="/admin/dashboard"
           routerLinkActive="active-link"
           class="nav-pill">
          Dashboard
        </a>

        <a routerLink="/admin/tasks"
           routerLinkActive="active-link"
           class="nav-pill">
          Tasks
        </a>

        <a routerLink="/admin/users"
           routerLinkActive="active-link"
           class="nav-pill">
          Users
        </a>

      </ng-container>

    </div>

    <!-- RIGHT SIDE -->
    <div class="ms-auto d-flex align-items-center gap-3">

      <!-- Theme Toggle -->
      <button class="theme-btn" (click)="toggleTheme()">
        {{ isDark ? '🌙' : '☀️' }}
      </button>

      <!-- User Chip -->
      <div class="user-chip">
        👤 {{ username }}
      </div>

      <!-- Logout -->
      <button class="logout-btn" (click)="logout()">
        Logout
      </button>

    </div>

  </div>
</nav>
