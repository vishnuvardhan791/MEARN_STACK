<div class="container mt-4">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold page-title">User Management</h4>

    <div class="user-count-chip">
      👥 {{ users.length }} Users
    </div>
  </div>

  <!-- FILTER BAR -->
  <div class="filter-bar mb-4">

    <input type="text"
           class="custom-input"
           placeholder=" Search users..."
           [(ngModel)]="searchText"
           (input)="applyFilters()">

    <select class="custom-input"
            [(ngModel)]="filterType"
            (change)="applyFilters()">
      <option value="all">All Users</option>
      <option value="active">Active</option>
      <option value="blocked">Blocked</option>
    </select>

  </div>

  <!-- USER CARDS -->
  <div class="row g-4">

    <div class="col-md-4" *ngFor="let user of filteredUsers">

      <div class="task-card user-card">

        <!-- HEADER -->
        <div class="task-header">

          <div>
            <h5 class="task-title mb-0">{{ user.username }}</h5>
            <small>User ID: {{ user.id }}</small>
          </div>

          <!-- ACTION ICONS -->
          <div class="task-icons" *ngIf="user.id !== currentUser?.id">

            <i class="bi"
               [ngClass]="user.isBlocked ? 'bi-person-check edit-icon' : 'bi-person-x delete-icon'"
               (click)="toggleBlock(user)"
               [title]="user.isBlocked ? 'Unblock User' : 'Block User'">
            </i>

            <i class="bi bi-x-circle delete-icon"
               (click)="deleteUser(user.id)"
               title="Delete User">
            </i>

          </div>

        </div>

        <!-- STATUS -->
        <div class="mt-2">
          <span class="badge status approved" *ngIf="!user.isBlocked">Active</span>
          <span class="badge status submitted" *ngIf="user.isBlocked">Blocked</span>
        </div>

        <!-- STATS -->
        <div class="stats mt-3">

          <div class="stat-box total">
            <h6>Total</h6>
            <p>{{ user.totalTasks }}</p>
          </div>

          <div class="stat-box pending">
            <h6>Pending</h6>
            <p>{{ user.pendingTasks }}</p>
          </div>

          <div class="stat-box completed">
            <h6>Done</h6>
            <p>{{ user.completedTasks }}</p>
          </div>

        </div>

      </div>

    </div>

  </div>

</div>
