<div class="container mt-4">

  <div class="card p-4 mb-4 shadow-sm border-0">
    <h5 class="fw-bold mb-3 text-primary">Create Task</h5>

    <form (ngSubmit)="addTask()">
      <div class="row g-3">

        <div class="col-md-3">
          <input type="text" class="form-control"
            [(ngModel)]="newTask.title" name="title"
            placeholder="Task Title" required>
        </div>

        <div class="col-md-3">
          <input type="text" class="form-control"
            [(ngModel)]="newTask.description" name="description"
            placeholder="Description">
        </div>

        <div class="col-md-2">
          <select class="form-select"
            [(ngModel)]="newTask.priority" name="priority">
            <option value="low">Low Priority</option>
            <option value="medium">Medium Priority</option>
            <option value="high">High Priority</option>
          </select>
        </div>

        <div class="col-md-2">
          <input type="date" class="form-control"
            [(ngModel)]="newTask.deadline" name="deadline">
        </div>

        <div class="col-md-2">
          <select class="form-select"
            [(ngModel)]="newTask.userId" name="userId">
            <option value="" disabled selected>Select User</option>
            <option *ngFor="let user of users"
                    [value]="user.id"
                    [disabled]="user.isBlocked">
              {{ user.username }} {{ user.isBlocked ? '(Blocked)' : '' }}
            </option>
          </select>
        </div>

      </div>

      <button class="btn btn-primary mt-3 px-4">
        + Add Task
      </button>
    </form>
  </div>

  <div *ngIf="tasks.length === 0" class="text-center mt-5">
    <h5 class="text-muted">No tasks available</h5>
  </div>
  <div class="card p-3 mb-3 shadow-sm">

  <div class="row g-3">

      <div class="col-md-4">
        <input type="text"
              class="form-control"
              placeholder="Search tasks..."
              [(ngModel)]="searchText"
              (input)="applyFilters()">
      </div>

      <div class="col-md-3">
        <select class="form-select"
                [(ngModel)]="filterStatus"
                (change)="applyFilters()">
          <option value="all">All</option>
          <option value="assigned">Assigned</option>
          <option value="submitted">Submitted</option>
          <option value="approved">Approved</option>
        </select>
      </div>

      <div class="col-md-3">
        <select class="form-select"
                [(ngModel)]="sortBy"
                (change)="applyFilters()">
          <option value="none">Sort By</option>
          <option value="deadline">Deadline</option>
          <option value="priority">Priority</option>
        </select>
      </div>

    </div>

  </div>

  <div class="row g-3 mt-3">

    <div class="col-md-4" *ngFor="let task of filteredTasks">

      <div class="card shadow-sm p-3 h-100"
        [ngClass]="{
          'border-start border-3 border-danger': isOverdue(task),
          'border-start border-3 border-success': task.status === 'approved'
        }">

        <h5 class="fw-bold">{{ task.title }}</h5>
        <p class="text-muted">{{ task.description }}</p>

        <small class="text-primary fw-semibold">
          Assigned to: {{ getUsername(task.userId) }}
        </small>

        <div class="mt-2">
          <span class="badge bg-danger" *ngIf="task.priority === 'high'">High</span>
          <span class="badge bg-warning" *ngIf="task.priority === 'medium'">Medium</span>
          <span class="badge bg-secondary" *ngIf="task.priority === 'low'">Low</span>
        </div>

        <small class="text-muted d-block mt-1">
          Deadline: {{ task.deadline | date:'mediumDate' }}
        </small>

        <div class="mt-2">
          <span class="badge bg-primary" *ngIf="task.status === 'assigned'">
            Assigned
          </span>

          <span class="badge bg-warning text-dark" *ngIf="task.status === 'submitted'">
            Submitted
          </span>

          <span class="badge bg-success" *ngIf="task.status === 'approved'">
            Approved
          </span>
        </div>

        <div class="mt-3 d-flex flex-column gap-2">

          <button *ngIf="task.status === 'submitted'"
                  class="btn btn-success btn-sm w-100"
                  (click)="approveTask(task.id)">
            Approve Task
          </button>

          <button class="btn btn-outline-danger btn-sm w-100"
                  (click)="deleteTask(task.id)">
            Delete
          </button>

        </div>

      </div>

    </div>

  </div>

</div>
