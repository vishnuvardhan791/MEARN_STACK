<div class="container mt-4">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold">Task Management</h4>

    <button class="btn create-btn" (click)="showForm = !showForm">
      + Create Task
    </button>
  </div>

  <!-- CREATE TASK FORM (HIDDEN) -->
  <div class="task-form-wrapper mb-4" [class.show]="showForm">
  <div class="task-form-card">

    <h5 class="mb-3">
      {{ isEditMode ? 'Edit Task' : 'Create New Task' }}
    </h5>

    <form (ngSubmit)="addTask()">
      <div class="row g-3">

        <div class="col-md-4">
          <input type="text" class="form-control custom-input"
            [(ngModel)]="newTask.title" name="title"
            placeholder="Enter task title" required>
        </div>

        <div class="col-md-4">
          <input type="text" class="form-control custom-input"
            [(ngModel)]="newTask.description" name="description"
            placeholder="Describe the task">
        </div>

        <div class="col-md-2">
          <select class="form-select custom-input"
            [(ngModel)]="newTask.priority"
            name="priority">

            <option [ngValue]="null" disabled>Select Priority</option>
            <option value="low">Low Priority</option>
            <option value="medium">Medium Priority</option>
            <option value="high">High Priority</option>

          </select>
        </div>

        <div class="col-md-2">
          <input type="date" class="form-control custom-input"
            [(ngModel)]="newTask.deadline" name="deadline"
            >
        </div>

        <div class="col-md-3">
          <select class="form-select custom-input user-select"
            [(ngModel)]="newTask.userId" name="userId">

            <option [ngValue]="null" disabled selected>Select User</option>

            <option *ngFor="let user of users"
                    [ngValue]="user.id"
                    [disabled]="user.isBlocked">
              {{ user.username }} {{ user.isBlocked ? '(Blocked)' : '' }}
            </option>

          </select>
        </div>

      </div>

      <button class="btn mt-3 create-btn px-4">
        {{ isEditMode ? 'Update Task' : 'Create Task' }}
      </button>
      <button *ngIf="isEditMode"
              type="button"
              class="btn btn-outline-secondary mt-3 ms-2"
              (click)="cancelEdit()">
        Cancel
      </button>
    </form>
  </div>
</div>
  <!-- FILTER BAR -->
  <div class="filter-bar mb-4">

    <input type="text"
      class="custom-input"
      placeholder="Search tasks..."
      [(ngModel)]="searchText"
      (input)="applyFilters()">

    <select class="custom-input"
            [(ngModel)]="filterStatus"
            (change)="applyFilters()">
      <option value="all">All Status</option>
      <option value="assigned">Assigned</option>
      <option value="submitted">Submitted</option>
      <option value="approved">Approved</option>
    </select>

    <select class="custom-input"
            [(ngModel)]="sortBy"
            (change)="applyFilters()">
      <option value="none">Sort By</option>
      <option value="deadline">Deadline</option>
      <option value="priority">Priority</option>
    </select>

  </div>

  <!-- TASK CARDS -->
  <div class="row g-4">

    <div class="col-md-4" *ngFor="let task of filteredTasks">

        <div class="task-card"
        [ngClass]="{
          'status-approved': task.status === 'approved',
          'status-submitted': task.status === 'submitted',
          'status-assigned': task.status === 'assigned',
          'status-overdue': isOverdue(task)
        }">

        <div class="task-header">

        <h5 class="task-title">{{ task.title }}</h5>

        <!-- ICON ACTIONS -->
        <div class="task-icons" *ngIf="task.status !== 'approved'">

          <i class="bi bi-pencil-square edit-icon"
            (click)="editTask(task); debugClick('edit', task)"
            title="Edit"></i>

          <i class="bi bi-x-circle delete-icon"
            (click)="deleteTask(task.id); debugClick('delete', task)"
            title="Delete"></i>

        </div>

      </div>


        <p class="task-desc">{{ task.description }}</p>

        <!-- Assigned -->
        <div class="task-meta">
          <span class="label">Assigned To</span>
          <span class="value">{{ getUsername(task.userId) }}</span>
        </div>

        <!-- Priority -->
        <div class="mt-2">
          <span class="badge priority high" *ngIf="task.priority === 'high'">High</span>
          <span class="badge priority medium" *ngIf="task.priority === 'medium'">Medium</span>
          <span class="badge priority low" *ngIf="task.priority === 'low'">Low</span>
        </div>

        <!-- Deadline -->
        <div class="task-meta mt-2">
          <span class="label">Deadline</span>
          <span class="value">{{ task.deadline | date:'mediumDate' }}</span>
        </div>

        <!-- Status -->
        <div class="mt-2">
          <span class="badge status assigned" *ngIf="task.status === 'assigned'">Assigned</span>
          <span class="badge status submitted" *ngIf="task.status === 'submitted'">Submitted</span>
          <span class="badge status approved" *ngIf="task.status === 'approved'">Approved</span>
        </div>

        <!-- ACTIONS -->
        <div class="task-actions mb-2">
        <button *ngIf="task.status === 'submitted'"
                class="btn btn-success btn-sm w-100"
                (click)="approveTask(task.id)">
          Approve
        </button>
      </div>

      </div>

    </div>

  </div>

</div>
