<div class="card p-3 mb-4 shadow-sm">
    <form (ngSubmit)="addTask()">
        <div class="row g-3">
            <div class="col-md-3">
                <input type="text" class="form-control"
                   [(ngModel)]="newTask.title" name="title"
                    placeholder="Title" >
            </div>

            <div class="col-md-3">
                <input type="text" class="form-control"
                    [(ngModel)]="newTask.description" name="description"
                    placeholder="Description">
            </div>

            <div class="col-md-2">
                <select class="form-select"
                    [(ngModel)]="newTask.priority" name="priority">

                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>

            <div class="col-md-2">
                <input type="date" class="form-control"
                    [(ngModel)]="newTask.deadline" name="deadline">
            </div>

            <div class="col-md-2">
                <select class="form-select"
                    [(ngModel)]="newTask.userId" name="userId">

                    <option *ngFor="let user of users" [value]="user.id">
                        {{user.username}}
                    </option>
                </select>
            </div>


        </div>

        <button class="btn btn-danger mt-3">Add TaskS</button>
    </form>

    <div class="row g-3 mt-3">

    <div class="col-md-4" *ngFor="let task of tasks">

    <div class="card shadow-sm p-3 h-100 border-start border-3 border-danger">

      <h5 class="fw-bold">{{ task.title }}</h5>
      <p class="text-muted">{{ task.description }}</p>

      <small class="text-primary fw-semibold">
        Assigned to: {{ getUsername(task.userId) }}
      </small>

      <div class="mt-2">
        <span class="badge bg-danger" *ngIf="task.priority === 'high'">High</span>
        <span class="badge bg-warning" *ngIf="task.priority === 'medium'">Medium</span>
        <span class="badge bg-secondary" *ngIf="task.priority === 'low'">Low</span>
      </div>

      <small class="text-muted d-block mt-1">
        Deadline: {{ task.deadline }}
      </small>

      <div class="mt-2">
        <span class="badge bg-success" *ngIf="task.completed">Completed</span>
        <span class="badge bg-warning text-dark" *ngIf="!task.completed">Pending</span>
      </div>

      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-sm btn-success" (click)="toggleComplete(task.id)">
          Toggle
        </button>

        <button class="btn btn-sm btn-danger" (click)="deleteTask(task.id)">
          Delete
        </button>
      </div>

    </div>

  </div>

</div>
</div>
