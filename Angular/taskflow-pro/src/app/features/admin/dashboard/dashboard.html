<div class="container mt-4">

  <!-- Header -->
  <div class="mb-4">
    <h3 class="fw-bold text-danger">Admin Dashboard </h3>
    <p class="text-muted">Manage users and monitor system activity</p>
  </div>

  <div class="row g-4">

    <div class="col-md-3">
      <div class="card admin-card shadow-sm border-0 text-center p-4">
        <div class="icon bg-primary text-white mb-3">
          <i class="bi bi-people-fill"></i>
        </div>
        <h6 class="text-muted">Total Users</h6>
        <h2 class="fw-bold text-primary">{{totalUsers}}</h2>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card admin-card shadow-sm border-0 text-center p-4">
        <div class="icon bg-dark text-white mb-3">
          <i class="bi bi-list-check"></i>
        </div>
        <h6 class="text-muted">Total Tasks</h6>
        <h2 class="fw-bold text-dark">{{totalTasks}}</h2>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card admin-card shadow-sm border-0 text-center p-4">
        <div class="icon bg-success text-white mb-3">
          <i class="bi bi-check-circle-fill"></i>
        </div>
        <h6 class="text-muted">Completed</h6>
        <h2 class="fw-bold text-success">{{completedTasks}}</h2>
      </div>
    </div>

  
    <div class="col-md-3">
      <div class="card admin-card shadow-sm border-0 text-center p-4">
        <div class="icon bg-danger text-white mb-3">
          <i class="bi bi-exclamation-circle-fill"></i>
        </div>
        <h6 class="text-muted">Pending</h6>
        <h2 class="fw-bold text-danger">{{pendingTasks}}</h2>
      </div>
    </div>

  </div>

</div>
