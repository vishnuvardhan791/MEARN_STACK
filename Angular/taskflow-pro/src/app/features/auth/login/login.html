<div class="container-fluid d-flex justify-content-center align-items-center vh-100 login-bg">
    
    <div class="card shadow-lg login-card border-0">

        <!-- HEADER -->
        <div class="card-header text-center bg-transparent border-0 pt-4">
            <h3 class="fw-bold title mb-1">Welcome Back</h3>
            <p class="subtitle small mb-2">Login to your account</p>
        </div>

        <!-- CHARACTER -->
        <div class="character-container text-center">
            <div class="face">
                <div class="eyes">
                    <div class="eye left-eye"></div>
                    <div class="eye right-eye"></div>
                </div>
                <div class="hands"></div>
            </div>
        </div>

        <!-- FORM -->
        <div class="card-body px-4 pb-4">
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

                <!-- USERNAME -->
                <div class="mb-3 input-group-custom">
                    <label class="form-label fw-semibold">Username</label>
                    <input 
                        type="text" 
                        class="form-control form-control-lg"
                        formControlName="username"
                        (focus)="onUsernameFocus()"
                        (input)="onTyping($event)"
                        (blur)="onBlur()"
                        placeholder="Enter username">

                    <small class="text-danger"
                        *ngIf="loginForm.controls.username.touched && loginForm.controls.username.invalid">
                        Username is required 
                    </small>
                </div>

                <!-- PASSWORD -->
                <div class="mb-3 input-group-custom">
                    <label class="form-label fw-semibold">Password</label>
                    <input 
                        type="password" 
                        class="form-control form-control-lg"
                        formControlName="password"
                        (focus)="onPasswordFocus()"
                        (blur)="onBlur()"
                        placeholder="Enter password">

                    <small class="text-danger"
                        *ngIf="loginForm.controls.password.touched && loginForm.controls.password.errors?.['required']">
                        Password is required
                    </small>

                    <small class="text-danger"
                        *ngIf="loginForm.controls.password.touched && loginForm.controls.password.errors?.['minlength']">
                        Minimum 8 characters required
                    </small>
                </div>
                <!-- LOGIN ERROR -->
                <div *ngIf="loginError" class="error-box">
                ❌ Invalid username or password
                </div>

                <!-- BUTTON -->
                <button class="btn login-btn w-100 mt-3 py-2 fw-semibold" type="submit">
                    Login
                </button>

            </form>
        </div>

        <!-- FOOTER -->
        <div class="card-footer text-center bg-transparent border-0 pb-4">
            <small class="footer-text">
                Don't you have an account?
                <a routerLink="/signup" class="signup-link">
                    Signup
                </a>
            </small>
        </div>

    </div>
</div>
