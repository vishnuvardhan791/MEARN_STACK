<div class="container-fluid d-flex justify-content-center align-items-center vh-100 signup-bg">

  <div class="card signup-card border-0">

    <!-- HEADER -->
    <div class="text-center pt-4">
      <h3 class="fw-bold title">Create Account</h3>
      <p class="subtitle">Join and start your journey 🚀</p>
    </div>

    <!-- CHARACTER -->
    <div class="character-container text-center">
      <div class="face" id="character">
        
        <div class="eyes">
          <div class="eye left-eye"></div>
          <div class="eye right-eye"></div>
        </div>

        <div class="hands"></div>

      </div>
    </div>

    <!-- FORM -->
    <div class="card-body px-4 pb-4">

      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">

        <!-- USERNAME -->
        <div class="mb-3 input-group-custom">
          <input 
            type="text"
            class="form-control form-control-lg"
            formControlName="username"
            placeholder="Username"
            (focus)="onUsernameFocus()"
            (input)="onTyping($event)"
            (blur)="onBlur()">
        </div>

        <!-- PASSWORD -->
        <div class="mb-3 input-group-custom">
          <input 
            type="password"
            class="form-control form-control-lg"
            formControlName="password"
            placeholder="Password"
            (focus)="onPasswordFocus()"
            (blur)="onBlur()">
        </div>

        <!-- CONFIRM -->
        <div class="mb-3 input-group-custom">
          <input 
            type="password"
            class="form-control form-control-lg"
            formControlName="confirmPassword"
            placeholder="Confirm Password"
            (focus)="onPasswordFocus()"
            (blur)="onBlur()">
        </div>

        <!-- ERROR -->
        <small class="text-danger"
          *ngIf="signupForm.touched && !passwordMatch()">
          Passwords do not match
        </small>

        <!-- BUTTON -->
        <button class="btn signup-btn w-100 mt-3 py-2 fw-semibold">
          Create Account
        </button>

      </form>
    </div>

    <!-- FOOTER -->
    <div class="text-center pb-4">
      <small class="text-muted">
        Already have an account?
        <a routerLink="/login" class="login-link">
          Login
        </a>
      </small>
    </div>

  </div>
</div>
