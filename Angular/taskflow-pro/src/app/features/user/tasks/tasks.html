<div class="container mt-4">

  <h4 class="mb-3 fw-bold text-primary">My Tasks</h4>

  <div *ngIf="tasks.length === 0" class="text-center text-muted mt-5">
    <i class="bi bi-inbox fs-1"></i>
    <p class="mt-2">No tasks assigned yet</p>
  </div>

  <div class="row g-3">

    <div class="col-md-4" *ngFor="let task of tasks">

      <div class="card shadow-sm p-3 h-100"
           [ngClass]="{
             'border-danger border-3': isOverdue(task),
             'border-success border-3': task.status === 'approved'
           }">

        <h5 class="fw-bold">{{ task.title }}</h5>
        <p class="text-muted small">{{ task.description }}</p>

        <div class="mt-2">
          <span class="badge bg-danger" *ngIf="task.priority === 'high'">High</span>
          <span class="badge bg-warning text-dark" *ngIf="task.priority === 'medium'">Medium</span>
          <span class="badge bg-secondary" *ngIf="task.priority === 'low'">Low</span>
        </div>

        <small class="text-muted d-block mt-2">
          📅 {{ task.deadline | date:'mediumDate' }}
        </small>

        <div class="mt-2">

          <span class="badge bg-danger"
                *ngIf="isOverdue(task) && task.status !== 'approved'">
            Overdue
          </span>

          <span class="badge bg-primary"
                *ngIf="task.status === 'assigned' && !isOverdue(task)">
            Assigned
          </span>

          <span class="badge bg-warning text-dark"
                *ngIf="task.status === 'submitted' && !isOverdue(task)">
            Submitted
          </span>

          <span class="badge bg-success"
                *ngIf="task.status === 'approved'">
            Approved
          </span>

        </div>

        <div class="mt-3">

          <button *ngIf="task.status === 'assigned' && !isOverdue(task)"
                  class="btn btn-success btn-sm w-100"
                  (click)="submitTask(task.id)">
            <i class="bi bi-upload"></i> Submit Task
          </button>

          <button *ngIf="task.status === 'submitted'"
                  class="btn btn-warning btn-sm w-100"
                  disabled>
            ⏳ Waiting for Approval
          </button>

          <button *ngIf="task.status === 'approved'"
                  class="btn btn-success btn-sm w-100"
                  disabled>
            ✅ Approved
          </button>

          <button *ngIf="isOverdue(task) && task.status !== 'approved'"
                  class="btn btn-secondary btn-sm w-100"
                  disabled>
            ❌ Deadline Missed
          </button>

        </div>

      </div>

    </div>

  </div>

</div>
