<div class="container mt-4">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold page-title">My Tasks</h4>
  </div>

  <!-- EMPTY STATE -->
  <div *ngIf="tasks.length === 0" class="empty-state text-center">
    <i class="bi bi-inbox"></i>
    <p>No tasks assigned yet</p>
  </div>

  <!-- TASK GRID -->
  <div class="row g-4">

    <div class="col-md-4"
     *ngFor="let task of tasks;">

      <div class="task-card"
           [ngClass]="{
             'status-overdue': isOverdue(task),
             'status-approved': task.status === 'approved',
             'status-submitted': task.status === 'submitted',
             'status-assigned': task.status === 'assigned'
           }">

        <!-- HEADER -->
        <div class="task-header">
          <h5 class="task-title">{{ task.title }}</h5>
        </div>

        <!-- DESCRIPTION -->
        <p class="task-desc">{{ task.description }}</p>

        <!-- PRIORITY -->
        <div class="mt-2">
          <span class="badge priority high" *ngIf="task.priority === 'high'">High</span>
          <span class="badge priority medium" *ngIf="task.priority === 'medium'">Medium</span>
          <span class="badge priority low" *ngIf="task.priority === 'low'">Low</span>
        </div>

        <!-- DEADLINE -->
        <div class="task-meta mt-2">
          <span class="label">Deadline</span>
          <span class="value">{{ task.deadline | date:'mediumDate' }}</span>
        </div>

        <!-- STATUS -->
        <div class="mt-2">

          <span class="badge status overdue"
                *ngIf="isOverdue(task) && task.status !== 'approved'">
            Overdue
          </span>

          <span class="badge status assigned"
                *ngIf="task.status === 'assigned' && !isOverdue(task)">
            Assigned
          </span>

          <span class="badge status submitted"
                *ngIf="task.status === 'submitted' && !isOverdue(task)">
            Submitted
          </span>

          <span class="badge status approved"
                *ngIf="task.status === 'approved'">
            Approved
          </span>

        </div>

        <!-- ACTION -->
        <div class="task-actions">

          <button *ngIf="task.status === 'assigned' && !isOverdue(task)"
                  class="btn action-btn submit-btn"
                  (click)="submitTask(task.id)">
            <i class="bi bi-upload"></i> Submit Task
          </button>

          <button *ngIf="task.status === 'submitted'"
                  class="btn action-btn waiting-btn"
                  disabled>
            ⏳ Waiting Approval
          </button>

          <button *ngIf="task.status === 'approved'"
                  class="btn action-btn approved-btn"
                  disabled>
            ✅ Approved
          </button>

          <button *ngIf="isOverdue(task) && task.status !== 'approved'"
                  class="btn action-btn overdue-btn"
                  disabled>
            ❌ Deadline Missed
          </button>

        </div>

      </div>

    </div>

  </div>

</div>
