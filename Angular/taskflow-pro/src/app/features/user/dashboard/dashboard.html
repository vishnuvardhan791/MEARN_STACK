<div class="container dashboard-container mt-4">

  <!-- HEADER -->
  <div class="dashboard-header mb-4">
    <h2>Welcome back 👋</h2>
    <p>Your task performance at a glance</p>
  </div>

  <!-- STATS GRID -->
  <div class="stats-grid">

    <!-- Total -->
    <div class="stat-card">
      <div class="stat-icon total">
        <i class="bi bi-list-task"></i>
      </div>
      <div>
        <p>Total Tasks</p>
        <h3>{{ totalTasks }}</h3>
      </div>
    </div>

    <!-- Assigned -->
    <div class="stat-card">
      <div class="stat-icon assigned">
        <i class="bi bi-person-workspace"></i>
      </div>
      <div>
        <p>Assigned</p>
        <h3>{{ assignedTasks }}</h3>
      </div>
    </div>

    <!-- Submitted -->
    <div class="stat-card">
      <div class="stat-icon submitted">
        <i class="bi bi-hourglass-split"></i>
      </div>
      <div>
        <p>Submitted</p>
        <h3>{{ submittedTasks }}</h3>
      </div>
    </div>

    <!-- Approved -->
    <div class="stat-card">
      <div class="stat-icon approved">
        <i class="bi bi-check-circle-fill"></i>
      </div>
      <div>
        <p>Approved</p>
        <h3>{{ approvedTasks }}</h3>
      </div>
    </div>

    <!-- Overdue -->
    <div class="stat-card overdue-card">
      <div class="stat-icon overdue">
        <i class="bi bi-exclamation-triangle"></i>
      </div>
      <div>
        <p>Overdue</p>
        <h3>{{ overdueTasks }}</h3>
      </div>
    </div>

  </div>

  <!-- CHART -->
  <div class="chart-card mt-4">
    <div class="chart-header">
      <h4>Task Distribution</h4>
    </div>

    <div class="chart-wrapper">
      <canvas id="userTaskChart"></canvas>
    </div>
  </div>

</div>
