<div class="container mt-4">

  <div class="mb-4">
    <h3 class="fw-bold text-primary">Welcome back</h3>
    <p class="text-muted">Here's a quick overview of your tasks</p>
  </div>

  <div class="row g-4">

    <div class="col-md-3">
      <div class="card dashboard-card shadow-sm border-0 text-center p-4">
        <div class="icon bg-dark text-white mb-3">
          <i class="bi bi-list-task"></i>
        </div>
        <h6 class="text-muted">Total Tasks</h6>
        <h2 class="fw-bold text-dark">{{ totalTasks }}</h2>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card dashboard-card shadow-sm border-0 text-center p-4">
        <div class="icon bg-primary text-white mb-3">
          <i class="bi bi-person-workspace"></i>
        </div>
        <h6 class="text-muted">Assigned</h6>
        <h2 class="fw-bold text-primary">{{ assignedTasks }}</h2>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card dashboard-card shadow-sm border-0 text-center p-4">
        <div class="icon bg-warning text-dark mb-3">
          <i class="bi bi-hourglass-split"></i>
        </div>
        <h6 class="text-muted">Submitted</h6>
        <h2 class="fw-bold text-warning">{{ submittedTasks }}</h2>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card dashboard-card shadow-sm border-0 text-center p-4">
        <div class="icon bg-success text-white mb-3">
          <i class="bi bi-check-circle-fill"></i>
        </div>
        <h6 class="text-muted">Approved</h6>
        <h2 class="fw-bold text-success">{{ approvedTasks }}</h2>
      </div>
    </div>

  </div>

  <div class="row g-4 mt-2">

    <div class="col-md-3">
      <div class="card dashboard-card shadow-sm border-0 text-center p-4">
        <div class="icon bg-danger text-white mb-3">
          <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h6 class="text-muted">Overdue</h6>
        <h2 class="fw-bold text-danger">{{ overdueTasks }}</h2>
      </div>
    </div>

  </div>

  <div class="card mt-4 p-3 shadow-sm text-center">

    <h5 class="fw-bold mb-2">📊 Task Distribution</h5>

    <div class="chart-container">
      <canvas id="userTaskChart"></canvas>
    </div>

  </div>

</div>
